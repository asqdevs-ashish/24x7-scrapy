name: Lead scraper
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Scraper · {0}', inputs.reason || 'manual run') || 'Scraper · scheduled' }}

on:
  schedule:
    - cron: '0 */3 * * *' # every 3 hours, UTC
  # Also started instantly by the dashboard (POST /api/jobs with is_priority,
  # or resuming a priority job) through the GitHub REST API.
  workflow_dispatch:
    inputs:
      max_jobs:
        description: 'Jobs to process in this run'
        required: false
        default: '1'
      reason:
        description: 'Why this run was started (shown in the run name)'
        required: false
        default: 'manual run'

# Never two workers at once. A new run waits for the previous one instead of
# cancelling it, so a job is never killed mid-scrape by the next cron tick.
# A dispatched run that has to wait still helps: the running worker sees the
# waiting priority job at its next heartbeat and hands over to it.
concurrency:
  group: lead-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 170

    defaults:
      run:
        working-directory: worker

    env:
      # Direct (unpooled) Neon URL: one long-lived process, no PgBouncer needed.
      DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.cache/puppeteer
      MAX_JOBS_PER_RUN: ${{ github.event.inputs.max_jobs || vars.MAX_JOBS_PER_RUN || '1' }}
      RUN_BUDGET_MINUTES: '150'
      STALE_JOB_MINUTES: '175'
      MAX_JOB_ATTEMPTS: '3'
      HEARTBEAT_EVERY: '20'
      HEARTBEAT_MAX_SECONDS: '90'
      MAX_FEED_CARDS: '500'
      ADDRESS_MUST_CONTAIN: ${{ vars.ADDRESS_MUST_CONTAIN }}
      HEADLESS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Chrome system libraries
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates fonts-liberation fonts-noto-core \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 \
            libcairo2 libcups2t64 libdbus-1-3 libdrm2 libexpat1 libgbm1 \
            libglib2.0-0t64 libgtk-3-0t64 libnspr4 libnss3 libpango-1.0-0 \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxkbcommon0 libxrandr2 libxshmfence1 xdg-utils

      - name: Cache Puppeteer Chrome
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('worker/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Ensure Chrome is downloaded
        run: npx puppeteer browsers install chrome

      - name: Run worker
        run: node src/index.js
